<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050506;
    --white: #f4f4f6;
    --gray: #9a9aa2;
    --gray-dim: #55555c;
    --glass: rgba(255,255,255,0.05);
    --glass-border: rgba(255,255,255,0.16);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Quicksand', sans-serif;
    color: var(--white);
    background: radial-gradient(ellipse at 30% 20%, #131318 0%, transparent 60%),
                radial-gradient(ellipse at 75% 75%, #0c0c10 0%, transparent 55%),
                var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  .star {
    position: fixed;
    background: #fff;
    border-radius: 50%;
    pointer-events: none;
    box-shadow: 0 0 4px rgba(255,255,255,0.8);
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(0.7); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  /* HUD: time / date / weather, monochrome */
  .hud {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    font-family: 'Zen Maru Gothic', sans-serif;
    user-select: none;
  }
  .hud-panel {
    background: linear-gradient(100deg, #2a2a30 0%, #101013 100%);
    border: 1px solid var(--glass-border);
    clip-path: polygon(0 0, 100% 0, 86% 100%, 0 100%);
    padding: 10px 40px 10px 16px;
  }
  .hud-time { font-size: 30px; font-weight: 700; color: var(--white); letter-spacing: 1px; line-height: 1; white-space: nowrap; }
  .hud-date { font-size: 11px; font-weight: 600; color: var(--gray); text-transform: uppercase; letter-spacing: 1.5px; margin-top: 3px; white-space: nowrap; }
  .hud-period {
    display: inline-block;
    margin-top: 2px;
    background: #17171b;
    border: 1px solid var(--glass-border);
    color: var(--white);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    padding: 4px 16px 4px 10px;
    clip-path: polygon(0 0, 100% 0, 82% 100%, 0 100%);
  }
  .weather-widget {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.04);
    border-left: 3px solid var(--gray);
    padding: 6px 16px 6px 10px;
    backdrop-filter: blur(4px);
  }
  .weather-temp { font-size: 16px; font-weight: 700; color: var(--white); white-space: nowrap; }

  /* search bar: top-center */
  .search-wrap {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    width: min(90vw, 420px);
  }
  form.search {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(8px);
    border-radius: 999px;
    padding: 6px 8px 6px 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  form.search input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--white);
    font-family: 'Quicksand', sans-serif;
    font-size: 15px;
    font-weight: 500;
    padding: 10px 0;
  }
  form.search input::placeholder { color: var(--gray); }
  form.search button {
    border: none;
    background: var(--white);
    color: #0a0a0c;
    font-weight: 700;
    font-family: 'Quicksand', sans-serif;
    padding: 11px 20px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  form.search button:hover { transform: translateY(-1px); opacity: 0.85; }
  form.search button:active { transform: translateY(0); }

  main {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 120px 24px 40px;
    text-align: center;
    max-width: 620px;
    margin: 0 auto;
  }

  .greeting {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 700;
    font-size: clamp(18px, 5vw, 26px);
    letter-spacing: 0.5px;
    margin: 0 0 34px;
    color: var(--white);
  }

  .links {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 14px;
    width: 100%;
  }
  .links a {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 16px 6px;
    text-decoration: none;
    color: var(--white);
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    font-size: 12px;
    font-weight: 600;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .links a:hover {
    transform: translateY(-3px);
    background: rgba(255,255,255,0.09);
    border-color: var(--white);
  }
  .links svg { width: 22px; height: 22px; }

  .gif-slot {
    position: fixed;
    bottom: 18px;
    right: 18px;
    z-index: 6;
    width: 180px;
    background: #1a1a1e;
    border: 1px solid #3a3a42;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    transition: width 0.2s ease, height 0.2s ease;
  }
  .gif-slot.maximized { width: 320px; }

  .win-titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(180deg, #2c2c32, #1e1e22);
    border-bottom: 1px solid #3a3a42;
    padding: 5px 6px 5px 10px;
    cursor: default;
    user-select: none;
  }
  .win-title {
    font-size: 10px;
    font-weight: 600;
    color: var(--gray);
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .win-buttons { display: flex; gap: 4px; }
  .win-btn {
    width: 20px;
    height: 18px;
    border: none;
    background: #33333a;
    color: var(--white);
    font-size: 11px;
    line-height: 1;
    border-radius: 3px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .win-btn:hover { background: #45454e; }
  .win-btn.win-close:hover { background: #e0263f; }

  .win-body {
    width: 100%;
    height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: pointer;
  }
  .gif-slot.maximized .win-body { height: 280px; }
  .gif-slot.minimized .win-body { display: none; }

  .win-body img {
    max-width: 100%;
    max-height: 100%;
    display: block;
  }
  .win-body .placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--gray);
    text-align: center;
    line-height: 1.5;
    padding: 0 10px;
  }

  .win-volume {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: #1e1e22;
    border-top: 1px solid #3a3a42;
  }
  .gif-slot.minimized .win-volume { display: none; }
  .win-volume input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 3px;
    background: #45454e;
    border-radius: 999px;
    outline: none;
  }
  .win-volume input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--white);
    cursor: pointer;
  }
  .win-volume input[type="range"]::-moz-range-thumb {
    width: 11px;
    height: 11px;
    border: none;
    border-radius: 50%;
    background: var(--white);
    cursor: pointer;
  }
  .win-volume-val {
    font-size: 10px;
    color: var(--gray);
    width: 30px;
    text-align: right;
  }

  @media (max-width: 480px) {
    .gif-slot { width: 130px; }
    .win-body { height: 120px; }
  }

  @media (max-width: 480px) {
    .links { grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .links a { padding: 12px 4px; font-size: 10px; }
    .hud-time { font-size: 22px; }
    .search-wrap { top: 18px; }
  }
</style>
</head>

<script>
  /* twinkling starfield */
  const starLayer = document.createDocumentFragment();
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = 1 + Math.random() * 2;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (1.5 + Math.random() * 3.5) + 's';
    s.style.animationDelay = (Math.random() * 4) + 's';
    starLayer.appendChild(s);
  }
  document.body.appendChild(starLayer);

  /* greetings, miku-flavored */
  const greetings = [
    "初音ミクだよ!",
    "ミクとお散歩しよ〜",
    "今日も頑張ろうね!",
    "調子はどう?",
    "一緒に何か聴く?",
    "おかえりなさい!"
  ];
  document.getElementById('greeting').textContent =
    greetings[Math.floor(Math.random() * greetings.length)];

  /* HUD clock, 12-hour */
  function pad(n) { return n.toString().padStart(2, '0'); }
  function updateHud() {
    const now = new Date();
    let h12 = now.getHours() % 12 || 12;
    const ampm = now.getHours() >= 12 ? 'pm' : 'am';
    document.getElementById('hud-time').textContent = `${h12}:${pad(now.getMinutes())} ${ampm}`;
    const days = ['sun','mon','tue','wed','thu','fri','sat'];
    const months = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
    document.getElementById('hud-date').textContent = `${days[now.getDay()]} ${now.getDate()} ${months[now.getMonth()]}`;
    const h = now.getHours();
    let period;
    if (h >= 5 && h < 12) period = 'morning';
    else if (h >= 12 && h < 17) period = 'afternoon';
    else if (h >= 17 && h < 20) period = 'evening';
    else period = 'night';
    document.getElementById('hud-period').textContent = period;
  }
  updateHud();
  setInterval(updateHud, 15000);

  /* weather icons, monochrome-friendly */
  const sunIconSVG = `
    <svg viewBox="0 0 40 40" width="30" height="30">
      <circle cx="20" cy="20" r="7" fill="#f4f4f6"/>
      <g stroke="#f4f4f6" stroke-width="2.5" stroke-linecap="round">
        <line x1="20" y1="4" x2="20" y2="9"/>
        <line x1="20" y1="31" x2="20" y2="36"/>
        <line x1="4" y1="20" x2="9" y2="20"/>
        <line x1="31" y1="20" x2="36" y2="20"/>
        <line x1="8.5" y1="8.5" x2="12" y2="12"/>
        <line x1="28" y1="28" x2="31.5" y2="31.5"/>
        <line x1="8.5" y1="31.5" x2="12" y2="28"/>
        <line x1="28" y1="12" x2="31.5" y2="8.5"/>
        <animateTransform attributeName="transform" type="rotate" from="0 20 20" to="360 20 20" dur="18s" repeatCount="indefinite"/>
      </g>
    </svg>`;
  const moonIconSVG = `
    <svg viewBox="0 0 40 40" width="30" height="30">
      <path d="M25 8a14 14 0 1 0 8 22 11 11 0 0 1-8-22z" fill="#e6e6ea"/>
      <circle cx="10" cy="10" r="1.2" fill="#fff"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="15" cy="6" r="0.9" fill="#fff"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
    </svg>`;
  const cloudIconSVG = `
    <svg viewBox="0 0 50 40" width="34" height="27">
      <g>
        <ellipse cx="18" cy="24" rx="12" ry="8" fill="#8a8a92"/>
        <ellipse cx="28" cy="20" rx="9" ry="7" fill="#b3b3ba"/>
        <animateTransform attributeName="transform" type="translate" values="-3 0; 3 0; -3 0" dur="6s" repeatCount="indefinite"/>
      </g>
      <g>
        <ellipse cx="32" cy="27" rx="10" ry="6.5" fill="#6f6f77" opacity="0.85"/>
        <animateTransform attributeName="transform" type="translate" values="3 0; -3 0; 3 0" dur="7s" repeatCount="indefinite"/>
      </g>
    </svg>`;
  const rainIconSVG = `
    <svg viewBox="0 0 50 46" width="34" height="31">
      <ellipse cx="24" cy="16" rx="14" ry="9" fill="#7a7a82"/>
      <ellipse cx="14" cy="20" rx="9" ry="7" fill="#9a9aa2"/>
      <g stroke="#cfd8dc" stroke-width="2" stroke-linecap="round">
        <line x1="14" y1="26" x2="12" y2="34">
          <animate attributeName="y1" values="26;34" dur="0.9s" repeatCount="indefinite"/>
          <animate attributeName="y2" values="34;42" dur="0.9s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0" dur="0.9s" repeatCount="indefinite"/>
        </line>
        <line x1="24" y1="26" x2="22" y2="34">
          <animate attributeName="y1" values="26;34" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
          <animate attributeName="y2" values="34;42" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
        </line>
        <line x1="34" y1="26" x2="32" y2="34">
          <animate attributeName="y1" values="26;34" dur="0.9s" begin="0.6s" repeatCount="indefinite"/>
          <animate attributeName="y2" values="34;42" dur="0.9s" begin="0.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0" dur="0.9s" begin="0.6s" repeatCount="indefinite"/>
        </line>
      </g>
    </svg>`;
  const weatherIcons = { sun: sunIconSVG, moon: moonIconSVG, cloud: cloudIconSVG, rain: rainIconSVG };
  function setWeatherIcon(type) {
    document.getElementById('weather-icon').innerHTML = weatherIcons[type] || cloudIconSVG;
  }
  function classifyWeather(code, isDay) {
    if ([0, 1].includes(code)) return isDay ? 'sun' : 'moon';
    if ([2, 3, 45, 48].includes(code)) return 'cloud';
    if ([51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(code)) return 'rain';
    if ([71,73,75,77,85,86].includes(code)) return 'cloud';
    return isDay ? 'sun' : 'moon';
  }
  async function loadWeather(lat, lon) {
    try {
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
      const data = await res.json();
      const cw = data.current_weather;
      document.getElementById('weather-temp').textContent = Math.round(cw.temperature) + '°C';
      setWeatherIcon(classifyWeather(cw.weathercode, cw.is_day === 1));
    } catch (e) {
      document.getElementById('weather-temp').textContent = '--°';
      setWeatherIcon('cloud');
    }
  }
  // Hardcoded location: Ciudad Hidalgo, Michoacán, MX — no permission prompt needed
  loadWeather(19.6927, -100.5540);

  /* miku window: minimize / maximize / close + click-to-play audio */
  const gifWindow = document.getElementById('gif-window');
  const winBody = document.getElementById('win-body');
  const mikuAudio = document.getElementById('miku-audio');
  const mikuVolume = document.getElementById('miku-volume');
  const mikuVolumeVal = document.getElementById('miku-volume-val');

  mikuAudio.volume = 0.8;
  mikuVolume.addEventListener('input', () => {
    mikuAudio.volume = mikuVolume.value / 100;
    mikuVolumeVal.textContent = mikuVolume.value + '%';
  });
  mikuVolume.addEventListener('click', (e) => e.stopPropagation());

  document.getElementById('win-min').addEventListener('click', () => {
    gifWindow.classList.toggle('minimized');
  });
  document.getElementById('win-max').addEventListener('click', () => {
    gifWindow.classList.toggle('maximized');
  });
  document.getElementById('win-close').addEventListener('click', () => {
    gifWindow.style.display = 'none';
  });
  winBody.addEventListener('click', () => {
    if (mikuAudio.paused) {
      mikuAudio.play().catch(() => {});
    } else {
      mikuAudio.pause();
    }
  });
</script>
